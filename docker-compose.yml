version: "3.8"

services:
  gsfibra-postgres:
    image: postgres:14
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-gsfibra}
      POSTGRES_USER: ${POSTGRES_USER:-gsfibra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
    volumes:
      - gsfibra-postgres:/var/lib/postgresql/data
    networks:
      - GsfibraNet
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 10
    deploy:
      restart_policy:
        condition: on-failure

  gsfibra-redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    volumes:
      - gsfibra-redis:/data
    networks:
      - GsfibraNet
    deploy:
      restart_policy:
        condition: on-failure

  gsfibra-rabbitmq:
    image: rabbitmq:3-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    volumes:
      - gsfibra-rabbitmq:/var/lib/rabbitmq
    networks:
      - GsfibraNet
    deploy:
      restart_policy:
        condition: on-failure

  gsfibra-backend:
    image: ghcr.io/juniorssilvaa/gsfibra_painel_aplicativo-backend:latest
    environment:
      SECRET_KEY: ${SECRET_KEY}
      DEBUG: ${DEBUG:-False}
      ENVIRONMENT: production
      POSTGRES_DB: ${POSTGRES_DB:-gsfibra}
      POSTGRES_USER: ${POSTGRES_USER:-gsfibra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Defina POSTGRES_PASSWORD}
      POSTGRES_HOST: gsfibra-postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: gsfibra-redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      DRAMATIQ_BROKER_URL: amqp://${RABBITMQ_USER}:${RABBITMQ_PASSWORD}@gsfibra-rabbitmq:5672//
      BACKEND_URL: ${BACKEND_URL:-https://api.gsfibra.com.br}
      FRONTEND_URL: ${FRONTEND_URL:-https://gsfibra.niohub.com.br}
      ALLOWED_HOSTS: ${ALLOWED_HOSTS:-gsfibra.niohub.com.br,api.gsfibra.com.br,localhost,127.0.0.1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://gsfibra.niohub.com.br}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS:-https://gsfibra.niohub.com.br}
      MOBILE_API_PUBLIC_BASE: ${MOBILE_API_PUBLIC_BASE:-https://api.gsfibra.com.br/v1}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-/opt/gsfibra/firebase-credentials.json}
    volumes:
      - gsfibra-media:/app/backend/media
      - gsfibra-static:/app/backend/staticfiles
    networks:
      - GsfibraNet
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=GsfibraNet"
      - "traefik.http.routers.gsfibra-api.rule=Host(`gsfibra.niohub.com.br`) && (PathPrefix(`/api`) || PathPrefix(`/v1`) || PathPrefix(`/api-token-auth`) || PathPrefix(`/auth`) || PathPrefix(`/webhook`) || PathPrefix(`/webhooks`) || PathPrefix(`/media`) || PathPrefix(`/ws`))"
      - "traefik.http.routers.gsfibra-api.entrypoints=websecure"
      - "traefik.http.routers.gsfibra-api.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.gsfibra-api.priority=30"
      - "traefik.http.services.gsfibra-api.loadbalancer.server.port=8010"
    deploy:
      restart_policy:
        condition: on-failure

  gsfibra-frontend:
    image: ghcr.io/juniorssilvaa/gsfibra_painel_aplicativo:latest
    networks:
      - GsfibraNet
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=GsfibraNet"
      - "traefik.http.routers.gsfibra-front.rule=Host(`gsfibra.niohub.com.br`)"
      - "traefik.http.routers.gsfibra-front.entrypoints=websecure"
      - "traefik.http.routers.gsfibra-front.tls.certresolver=letsencryptresolver"
      - "traefik.http.routers.gsfibra-front.priority=1"
      - "traefik.http.services.gsfibra-front.loadbalancer.server.port=80"
    deploy:
      restart_policy:
        condition: on-failure

networks:
  GsfibraNet:
    external: true

volumes:
  gsfibra-postgres:
  gsfibra-redis:
  gsfibra-rabbitmq:
  gsfibra-media:
  gsfibra-static:
