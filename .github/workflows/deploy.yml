name: Deploy GSFibra

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  packages: write
  actions: read
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_FRONT: ghcr.io/juniorssilvaa/gsfibra_painel_aplicativo
  IMAGE_BACKEND: ghcr.io/juniorssilvaa/gsfibra_painel_aplicativo-backend

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.4.1

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: pnpm
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install and build front
        working-directory: front
        run: |
          pnpm install --no-frozen-lockfile
          pnpm build

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Backend check
        working-directory: backend
        env:
          SECRET_KEY: ci-test-secret
          DEBUG: "True"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python manage.py check --deploy || python manage.py check

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata (frontend)
        id: meta_front
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_FRONT }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable={{is_default_branch}}

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.frontend
          push: true
          tags: ${{ steps.meta_front.outputs.tags }}
          labels: ${{ steps.meta_front.outputs.labels }}
          provenance: false

      - name: Docker metadata (backend)
        id: meta_backend
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_BACKEND }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=sha
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=stable,enable={{is_default_branch}}

      - name: Build and push backend
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ steps.meta_backend.outputs.tags }}
          labels: ${{ steps.meta_backend.outputs.labels }}
          provenance: false

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Empacotar instalador do provedor
        run: |
          set -euo pipefail
          tar -czf installer-gsfibra-painel.tar.gz installer/provedor
          ls -lh installer-gsfibra-painel.tar.gz

      - name: Upload artefato do instalador
        uses: actions/upload-artifact@v4
        with:
          name: installer-gsfibra-painel
          path: installer-gsfibra-painel.tar.gz
          retention-days: 30

      - name: Publicar release (tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: installer-gsfibra-painel.tar.gz
          generate_release_notes: true

      - name: Resumo
        run: |
          echo "Imagens:"
          echo "  ${{ env.IMAGE_FRONT }}:latest"
          echo "  ${{ env.IMAGE_BACKEND }}:latest"
          echo "Instalador: installer-gsfibra-painel.tar.gz"
