name: Deploy GSFibra

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: gsfibra-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: pnpm/action-setup@v4
      with:
        version: 10.4.1
        run_install: false

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: pnpm
        cache-dependency-path: front/pnpm-lock.yaml

    - name: Install and build front
      env:
        VITE_API_URL: "https://gsfibra.niohub.com.br"
        VITE_WS_URL: "wss://gsfibra.niohub.com.br/ws"
        VITE_GSFIBRA_APP_URL: "https://gsfibra.niohub.com.br"
      run: |
        pnpm --dir front install --no-frozen-lockfile
        pnpm --dir front build

  build-and-push:
    needs: test
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: frontend
            image: juniorssilvaa/gsfibra_painel_aplicativo
            file: ./Dockerfile.frontend
            vite: true
          - id: backend
            image: juniorssilvaa/gsfibra_painel_aplicativo-backend
            file: ./Dockerfile.backend
            vite: false
    steps:
    - uses: actions/checkout@v4

    - uses: docker/setup-buildx-action@v3

    - uses: docker/login-action@v3
      with:
        registry: ${{ env.REGISTRY }}
        username: ${{ github.actor }}
        password: ${{ secrets.GHCR_TOKEN || github.token }}

    - name: Build args
      id: vite
      run: |
        if [ "${{ matrix.vite }}" = "true" ]; then
          {
            # Mesmo origin (Caddy encaminha /api e /v1) — instalador provedor :8443
            echo "VITE_API_URL="
            echo "VITE_WS_URL="
            echo "VITE_GSFIBRA_APP_URL="
          } > /tmp/vite.args
        else
          : > /tmp/vite.args
        fi
        echo "args<<EOF" >> "$GITHUB_OUTPUT"
        cat /tmp/vite.args >> "$GITHUB_OUTPUT"
        echo "EOF" >> "$GITHUB_OUTPUT"

    - uses: docker/build-push-action@v5
      with:
        context: .
        file: ${{ matrix.file }}
        push: true
        tags: |
          ${{ env.REGISTRY }}/${{ matrix.image }}:latest
          ${{ env.REGISTRY }}/${{ matrix.image }}:${{ github.sha }}
        build-args: ${{ steps.vite.outputs.args }}
        provenance: false
        cache-from: type=gha,scope=gsfibra-painel-${{ matrix.id }}
        cache-to: type=gha,mode=max,scope=gsfibra-painel-${{ matrix.id }}
