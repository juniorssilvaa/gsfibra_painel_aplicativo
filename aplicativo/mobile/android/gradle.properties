# Codemagic M2 (8GB): Jetifier no engine Flutter estoura heap.
org.gradle.jvmargs=-Xmx6G -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableJetifier=false
org.gradle.parallel=false
org.gradle.workers.max=2
# Windows: projeto em E: e Pub Cache em C: quebram o cache incremental do Kotlin
kotlin.incremental=false
kotlin.incremental.java=false
kotlin.caching.enabled=false
kotlin.compiler.execution.strategy=in-process
